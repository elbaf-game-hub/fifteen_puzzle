name: fifteen_puzzle
description: 15 Puzzle — Game Hub module.

# Mobile bundle identifiers
#   Android: applicationId = com.elbaftech.game_hub.fifteen_puzzle
#   iOS:     CFBundleIdentifier = com.elbaftech.game_hub.fifteen_puzzle
#   Apply with: ./tool/apply_bundle_ids.sh fifteen_puzzle
#
version: 0.1.0
publish_to: none

environment:
  sdk: ">=2.18.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  game_module:
    path: ../../game_hub_core/game_module
  game_assets:
    path: ../../game_hub_core/game_assets
  flutter_svg: ^2.0.10
  audioplayers: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/svg/
    - assets/sfx/
